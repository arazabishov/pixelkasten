name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  test-python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exiftool (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libimage-exiftool-perl
      - name: Install exiftool (Windows)
        if: runner.os == 'Windows'
        run: choco install exiftool -y
      - run: uv sync
      - name: Unit tests
        run: uv run pytest test/unit/ -v
      - name: Integration tests
        run: uv run pytest test/integration/ -v

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Ruff check
        run: uv run ruff check src/
      - name: Ruff format check
        run: uv run ruff format --check src/
