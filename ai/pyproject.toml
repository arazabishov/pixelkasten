[project]
name = "pixelkasten-ai"
version = "0.1.0"
description = "AI-powered photo categorization using CLIP embeddings and clustering"
requires-python = ">=3.12"
dependencies = [
    # CLIP model loading and inference. This is the canonical open-source CLIP
    # library — it handles downloading model weights, image preprocessing, and
    # encoding images/text into embedding vectors.
    "open-clip-torch>=2.29.0",

    # Clustering algorithms (HDBSCAN, k-means) for grouping similar embeddings.
    # HDBSCAN was added to scikit-learn in v1.3, so no separate package needed.
    "scikit-learn>=1.3.0",

    # Array operations on embedding vectors (dot products, norms, stacking).
    "numpy>=1.26.0",

    # CLI framework with rich integration for progress bars, colored output,
    # and formatted tables.
    "typer>=0.15.0",
    "rich>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Register the CLI command so `uv run pixelkasten-ai` works.
[project.scripts]
pixelkasten-ai = "pixelkasten_ai.cli:app"
