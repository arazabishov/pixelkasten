# Separate import namespace (pixelkasten_cli) so it doesn't shadow the core package
[project]
name = "pixelkasten-cli"
version = "0.1.0"
description = "CLI interface for pixelkasten photo library organizer"
requires-python = ">=3.12"
dependencies = [
  "pixelkasten-core",
  "typer>=0.15.0",
  "rich>=13.0.0",
]

[project.scripts]
pixelkasten = "pixelkasten_cli.cli:app"

[build-system]
requires = [
  "hatchling",
]
build-backend = "hatchling.build"

# Resolve from the sibling workspace package, not PyPI
[tool.uv.sources]
pixelkasten-core = { workspace = true }
