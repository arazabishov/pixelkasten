# CLI frontend — typer + rich UI over the core library.
# Import namespace: pixelkasten_cli.* (separate to avoid colliding with core)
[project]
name = "pixelkasten-cli"
version = "0.1.0"
description = "CLI interface for pixelkasten photo library organizer"
requires-python = ">=3.12"
dependencies = [
    "pixelkasten-core",
    "typer>=0.15.0",
    "rich>=13.0.0",
]

# Registers `uv run pixelkasten` as a shell command pointing at the typer app.
[project.scripts]
pixelkasten = "pixelkasten_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Resolve "pixelkasten" from the sibling workspace package, not PyPI.
[tool.uv.sources]
pixelkasten-core = { workspace = true }
