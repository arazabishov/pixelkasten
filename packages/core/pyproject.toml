# Core library — pipeline logic, stages, handlers, AI album discovery.
# Import namespace: pixelkasten.*
[project]
name = "pixelkasten-core"
version = "0.1.0"
description = "Photo library organizer — Google Takeout processing and AI-powered categorization"
requires-python = ">=3.12"
dependencies = [
  "open-clip-torch>=2.29.0",
  "scikit-learn>=1.3.0",
  "numpy>=1.26.0",
  "ollama>=0.4.0",
  "reverse_geocoder>=1.5.1",
]

# Distribution name differs from import name (pixelkasten), so tell hatch
# where the actual Python package lives.
[tool.hatch.build.targets.wheel]
packages = [
  "src/pixelkasten",
]

[build-system]
requires = [
  "hatchling",
]
build-backend = "hatchling.build"
